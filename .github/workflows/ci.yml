name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The lint levels live in Cargo.toml; CI is what turns them into failures.
  RUSTFLAGS: -D warnings

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Unit and integration tests
        run: cargo test --all-targets

      # --all-targets skips doctests, and the crate docs carry runnable
      # examples, so they get their own run.
      - name: Doc tests
        run: cargo test --doc

      # Release has overflow-checks on and is what real callers build, so
      # the panic-freedom tests matter most against optimized code.
      - name: Tests (release)
        run: cargo test --release

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Formatting
        run: cargo fmt --check

      # pedantic + nursery + cargo + the panic-focused restriction lints,
      # all configured in Cargo.toml under [lints].
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
